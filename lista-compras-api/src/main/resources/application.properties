server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:listacomprasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Cache
spring.cache.type=simple

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=always
info.app.name=Lista de Compras API
info.app.description=API REST para gerenciamento de listas de compras
info.app.version=1.0.0
info.app.authors=Pedro Vaz, Joao Victor

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
